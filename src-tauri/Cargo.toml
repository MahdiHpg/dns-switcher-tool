[package]
name = "dns-switcher"
version = "1.1.0"
description = "Modern DNS switcher for Windows — profiles, drag-reorder, per-profile colors, appearance settings"
authors = ["MahdiDev"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dns_switcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# کوچکترین باینری ممکن: بهینه‌سازی برای حجم، حذف نمادها و LTO
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
